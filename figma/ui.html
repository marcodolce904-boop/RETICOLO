<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reticolo</title>
  <style>
/* Reticolo - pannello. Token in :root, il colore di fondo segue il tema dell'app Adobe (vedi main.js). */
:root {
  --bg: #232323;
  --surface: #2b2b2b;
  --surface-2: #333333;
  --surface-3: #3d3d3d;
  --line: #404040;
  --line-strong: #555555;
  --text: #e8e8e8;
  --text-dim: #a8a8a8;
  --text-faint: #8a8a8a;
  --accent: #1b6ad6;          /* fondo pulsanti primari: contrasto 5:1 con testo bianco */
  --accent-hover: #2477ea;
  --accent-ink: #7fb2ff;      /* accento usato come testo su fondo scuro */
  --accent-soft: rgb(27 106 214 / 0.18);
  --on-accent: #ffffff;
  --danger: #ff7b72;
  --focus: #7fb2ff;
  --star: #f2b84b;
  --stage: #3a3a3a;
  --radius: 4px;            /* controlli */
  --radius-card: 6px;       /* card della libreria */
  --font: "Segoe UI", "Adobe Clean", system-ui, -apple-system, sans-serif;
  --mono: "Cascadia Mono", "Consolas", ui-monospace, monospace;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  color-scheme: dark;
}

:root.theme-light {
  --bg: #f0f0f0;
  --surface: #ffffff;
  --surface-2: #e9e9e9;
  --surface-3: #dddddd;
  --line: #d0d0d0;
  --line-strong: #b5b5b5;
  --text: #1f1f1f;
  --text-dim: #555555;
  --text-faint: #6b6b6b;
  --accent: #1557b8;
  --accent-hover: #1a63cf;
  --accent-ink: #1557b8;
  --accent-soft: rgb(21 87 184 / 0.12);
  --danger: #c4312a;
  --focus: #1557b8;
  --star: #b9780b;
  --stage: #d6d6d6;
  color-scheme: light;
}

/* fuori da Adobe (anteprima nel browser) segue il tema del sistema */
@media (prefers-color-scheme: light) {
  :root.demo:not(.theme-dark) {
    --bg: #f0f0f0; --surface: #ffffff; --surface-2: #e9e9e9; --surface-3: #dddddd;
    --line: #d0d0d0; --line-strong: #b5b5b5; --text: #1f1f1f; --text-dim: #555555; --text-faint: #6b6b6b;
    --accent: #1557b8; --accent-hover: #1a63cf; --accent-ink: #1557b8; --accent-soft: rgb(21 87 184 / 0.12);
    --danger: #c4312a; --focus: #1557b8; --star: #b9780b; --stage: #d6d6d6;
    color-scheme: light;
  }
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font: 400 12px/1.4 var(--font);
  -webkit-font-smoothing: antialiased;
}

body { overflow: hidden; }

button, input, select { font: inherit; color: inherit; }

[hidden] { display: none !important; }

.ico { width: 15px; height: 15px; flex: none; display: block; }

:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ------------------------------------------------------------------ layout */

.app {
  position: relative;
  height: 100%;
  display: flex;
  flex-direction: column;
  min-width: 240px;
}

.view {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 10px 12px 12px;
  scrollbar-width: thin;
}

.view::-webkit-scrollbar { width: 8px; }
.view::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 4px; }

/* ------------------------------------------------------------------ barra in alto */

.bar {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 40px;
  padding: 0 8px 0 12px;
  border-bottom: 1px solid var(--line);
  flex: none;
}

.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 0.01em;
  margin-right: auto;
  white-space: nowrap;
}

.brand .ico { width: 16px; height: 16px; color: var(--accent-ink); }

.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border: 0;
  border-radius: var(--radius);
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  transition: background 0.15s var(--ease), color 0.15s var(--ease), transform 0.1s var(--ease);
}

.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn:active { transform: scale(0.94); }
.icon-btn[aria-pressed="true"] { color: var(--accent-ink); background: var(--accent-soft); }
.icon-btn:disabled { opacity: 0.4; cursor: default; }

.pill-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 26px;
  padding: 0 10px;
  border: 0;
  border-radius: var(--radius);
  background: var(--accent);
  color: var(--on-accent);
  font-weight: 600;
  font-size: 11px;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.15s var(--ease), transform 0.1s var(--ease);
}

.pill-btn:hover { background: var(--accent-hover); }
.pill-btn:active { transform: translateY(1px); }
.pill-btn .ico { width: 14px; height: 14px; }

/* ------------------------------------------------------------------ tab */

.tabs {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 2px;
  padding: 2px;
  background: var(--surface);
  border-radius: calc(var(--radius) + 2px);
  margin-bottom: 10px;
}

.tab {
  height: 26px;
  border: 0;
  border-radius: var(--radius);
  background: transparent;
  color: var(--text-dim);
  font-size: 11.5px;
  cursor: pointer;
  transition: background 0.15s var(--ease), color 0.15s var(--ease);
}

.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { background: var(--accent); color: var(--on-accent); font-weight: 600; }

.subtabs {
  display: flex;
  flex-wrap: wrap;
  gap: 2px;
  border-bottom: 1px solid var(--line);
  margin: 2px 0 10px;
}

.subtab {
  flex: 1 1 auto;
  padding: 0 2px;
  white-space: nowrap;
  height: 26px;
  border: 0;
  border-bottom: 2px solid transparent;
  background: transparent;
  color: var(--text-dim);
  font-size: 11px;
  cursor: pointer;
  margin-bottom: -1px;
}

.subtab:hover { color: var(--text); }
.subtab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent-ink); font-weight: 600; }

/* ------------------------------------------------------------------ campi */

.row { display: flex; align-items: center; gap: 6px; }
.row > .grow { flex: 1; min-width: 0; }

.target-row { margin-bottom: 12px; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 8px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px 8px; }

.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; min-width: 0; }
.grid2 .field { margin-bottom: 0; }
.grid2 + .field, .grid2 + .grid2, .field + .grid2 { margin-top: 10px; }

.lbl {
  font-size: 10.5px;
  color: var(--text-dim);
  letter-spacing: 0.02em;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}

.help { font-size: 10.5px; color: var(--text-faint); margin-top: -2px; }
.input.mono { font-family: var(--mono); font-size: 11.5px; }
.field.muted { opacity: 0.45; }

.input, .select, .num {
  height: 28px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  transition: border-color 0.15s var(--ease);
}

.input, .select { width: 100%; padding: 0 8px; }
.input:hover, .select:hover, .num:hover { border-color: var(--line-strong); }
.input:focus, .select:focus, .num:focus-within { border-color: var(--focus); outline: none; }

.select {
  appearance: none;
  padding-right: 24px;
  background-image: linear-gradient(45deg, transparent 50%, var(--text-dim) 50%), linear-gradient(135deg, var(--text-dim) 50%, transparent 50%);
  background-position: calc(100% - 13px) 12px, calc(100% - 9px) 12px;
  background-size: 4px 4px;
  background-repeat: no-repeat;
  text-overflow: ellipsis;
}

.select option, .select optgroup { background: var(--surface); color: var(--text); }

.num { display: flex; align-items: center; overflow: hidden; }
.num input {
  flex: 1;
  width: 100%;
  min-width: 0;
  height: 100%;
  border: 0;
  background: transparent;
  padding: 0 6px;
  text-align: center;
  font-family: var(--mono);
  font-size: 11.5px;
  outline: none;
}
.num.left input { text-align: left; padding-left: 8px; }

.step {
  width: 26px;
  height: 100%;
  border: 0;
  background: transparent;
  color: var(--text-dim);
  display: grid;
  place-items: center;
  cursor: pointer;
}
.step:hover { color: var(--text); background: var(--surface-2); }
.step:active { background: var(--surface-3); }
.step .ico { width: 12px; height: 12px; }

.suffix { padding: 0 8px 0 2px; color: var(--text-faint); font-size: 10.5px; font-family: var(--mono); }

.input.invalid, .num.invalid { border-color: var(--danger); }

/* margini */
.margins { margin-top: 2px; }
.margins .cells { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.margins .cell { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.margins .cell span { font-size: 10px; color: var(--text-faint); }
.margins .num input { padding: 0 2px; }

/* segmenti (unita', direzione, sizing) */
.seg {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: 2px;
  padding: 2px;
  height: 28px;
  border-radius: var(--radius);
  background: var(--surface);
  border: 1px solid var(--line);
}
.seg button {
  border: 0;
  border-radius: 3px;
  background: transparent;
  color: var(--text-dim);
  font-size: 11px;
  cursor: pointer;
  white-space: nowrap;
  padding: 0 4px;
}
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--surface-3); color: var(--text); font-weight: 600; }

/* switch */
.switch { position: relative; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .track {
  width: 28px; height: 16px; border-radius: 8px; background: var(--surface-3);
  position: relative; transition: background 0.2s var(--ease); flex: none;
}
.switch .track::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%;
  background: var(--text); transition: transform 0.2s var(--ease);
}
.switch input:checked + .track { background: var(--accent); }
.switch input:checked + .track::after { transform: translateX(12px); background: #fff; }
.switch input:focus-visible + .track { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ------------------------------------------------------------------ varianti composizione */

.variants { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 10px; }

.variant {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 34px;
  padding: 0 8px 0 6px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--text);
  font-size: 11.5px;
  text-align: left;
  cursor: pointer;
  min-width: 0;
  transition: border-color 0.15s var(--ease), background 0.15s var(--ease);
}
.variant span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.variant:hover { border-color: var(--line-strong); }
.variant[aria-pressed="true"] { border-color: var(--accent-ink); background: var(--accent-soft); }
.variant svg { width: 30px; height: 22px; flex: none; border-radius: 2px; background: var(--surface-2); color: var(--accent-ink); }

.flips { display: flex; gap: 4px; }

/* ------------------------------------------------------------------ readout + azioni */

.readout {
  min-height: 18px;
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--text-dim);
  margin: 4px 0 10px;
}
.readout.err { color: var(--danger); font-family: var(--font); }

.actions { border-top: 1px solid var(--line); padding-top: 10px; }

.live-row { justify-content: space-between; margin-bottom: 10px; }

.btn {
  height: 30px;
  padding: 0 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: background 0.15s var(--ease), border-color 0.15s var(--ease), transform 0.1s var(--ease);
}
.btn:hover { background: var(--surface-2); border-color: var(--line-strong); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.45; cursor: default; transform: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.small { height: 26px; padding: 0 10px; font-size: 11px; }
.btn.danger { color: var(--danger); }
.btn .ico { width: 14px; height: 14px; }

.gen-row { display: grid; grid-template-columns: 1fr auto; gap: 6px; margin-bottom: 10px; }

.preset-row .lbl { flex: none; min-width: 40px; }

.save-form {
  margin-top: 8px;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  background: var(--surface);
  display: flex;
  flex-direction: column;
  gap: 8px;
  animation: rise 0.25s var(--ease);
}
.save-form .field { margin: 0; }
.save-form .row { justify-content: flex-end; }

.notice {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  padding: 8px 10px;
  margin-bottom: 10px;
  border-radius: var(--radius);
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--text-dim);
  font-size: 11px;
}
.notice .ico { color: var(--accent-ink); margin-top: 1px; }

/* ------------------------------------------------------------------ libreria */

.view-head { display: flex; align-items: center; gap: 6px; margin: -2px 0 10px -4px; }
.view-head h2 { margin: 0; font-size: 13px; font-weight: 600; margin-right: auto; }
.view-head .count { color: var(--text-faint); font-family: var(--mono); font-size: 11px; font-weight: 400; margin-left: 6px; }

.search { position: relative; margin-bottom: 8px; }
.search .ico { position: absolute; left: 8px; top: 7px; color: var(--text-faint); width: 14px; height: 14px; }
.search .input { padding-left: 28px; }

.chips { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 2px; margin-bottom: 10px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none;
  height: 24px;
  padding: 0 10px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: transparent;
  color: var(--text-dim);
  font-size: 11px;
  cursor: pointer;
}
.chip:hover { color: var(--text); border-color: var(--line-strong); }
.chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 600; }

.lib-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
.lib-tools .btn.primary { grid-column: 1 / -1; }

.lib-list { display: flex; flex-direction: column; gap: 6px; }

.card {
  display: grid;
  grid-template-columns: 64px 1fr;
  gap: 10px;
  padding: 8px;
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  background: var(--surface);
  animation: rise 0.3s var(--ease) both;
  animation-delay: calc(var(--i, 0) * 25ms);
}
.card:hover { border-color: var(--line-strong); }

.thumb {
  width: 64px;
  height: 48px;
  border-radius: 3px;
  background: var(--surface-2);
  color: var(--accent-ink);
  display: block;
}

.card .body { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.card .name { font-weight: 600; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .meta { font-family: var(--mono); font-size: 10.5px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px; }
.card .tag { font-size: 10px; color: var(--text-faint); background: var(--surface-2); border-radius: 3px; padding: 0 5px; line-height: 16px; }
.card .ops { display: flex; align-items: center; gap: 2px; margin-top: 6px; }
.card .ops .btn { margin-right: auto; }
.card .ops .icon-btn { width: 24px; height: 24px; }
.card .ops .icon-btn .ico { width: 14px; height: 14px; }
.card .fav[aria-pressed="true"] { color: var(--star); background: transparent; }
.card .rename-input { height: 24px; font-weight: 600; }

.confirm { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 6px; margin-top: 6px; font-size: 11px; color: var(--danger); }
.confirm span { flex: 1 0 100%; overflow-wrap: anywhere; }

.group-title { font-size: 10.5px; color: var(--text-faint); margin: 12px 0 6px; letter-spacing: 0.02em; }

.empty {
  text-align: center;
  padding: 24px 12px;
  border: 1px dashed var(--line-strong);
  border-radius: var(--radius-card);
  color: var(--text-dim);
}
.empty .ico { width: 28px; height: 28px; margin: 0 auto 8px; color: var(--text-faint); }
.empty strong { display: block; color: var(--text); margin-bottom: 4px; font-size: 12.5px; }
.empty p { margin: 0 auto 12px; max-width: 30ch; font-size: 11px; }

.lib-foot { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 10.5px; color: var(--text-faint); }
.lib-foot code { font-family: var(--mono); color: var(--text-dim); word-break: break-all; display: block; margin: 2px 0 6px; }

.dropzone {
  position: absolute;
  inset: 8px;
  border: 2px dashed var(--accent-ink);
  border-radius: var(--radius-card);
  background: var(--bg);
  opacity: 0.94;
  display: grid;
  place-items: center;
  text-align: center;
  padding: 20px;
  color: var(--text);
  font-weight: 600;
  pointer-events: none;
  z-index: 20;
}

/* ------------------------------------------------------------------ impostazioni */

.section { margin-bottom: 16px; }
.section h3 { font-size: 11.5px; font-weight: 600; margin: 0 0 8px; color: var(--text); }

.color { display: flex; align-items: center; gap: 6px; }
.color input[type="color"] {
  width: 28px; height: 28px; padding: 0; border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface); cursor: pointer; flex: none;
}
.color input[type="color"]::-webkit-color-swatch-wrapper { padding: 3px; }
.color input[type="color"]::-webkit-color-swatch { border: 0; border-radius: 2px; }
.color .input { font-family: var(--mono); font-size: 11px; text-transform: uppercase; }

.check-row { justify-content: space-between; padding: 6px 0; gap: 12px; }
.check-row > span { color: var(--text); font-size: 11.5px; }

/* ------------------------------------------------------------------ toast */

.toast {
  position: absolute;
  left: 12px;
  right: 12px;
  bottom: 12px;
  padding: 8px 12px;
  border-radius: var(--radius);
  background: var(--text);
  color: var(--bg);
  font-size: 11.5px;
  box-shadow: 0 6px 20px rgb(0 0 0 / 0.35);
  opacity: 0;
  transform: translateY(8px);
  pointer-events: none;
  transition: opacity 0.2s var(--ease), transform 0.2s var(--ease);
  z-index: 30;
}
.toast.show { opacity: 1; transform: none; }
.toast.err { background: var(--danger); color: #fff; }

@keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* pannello stretto: il pulsante Libreria resta solo icona */
@media (max-width: 300px) {
  .pill-btn { width: 28px; padding: 0; justify-content: center; }
  .pill-btn span + span { display: none; }
  .bar { gap: 2px; }
}

/* ------------------------------------------------------------------ anteprima nel browser */

.demo body { display: grid; grid-template-columns: 1fr 320px; }
.demo .app { border-left: 1px solid var(--line); }
.stage {
  display: none;
  background: var(--stage);
  overflow: auto;
  padding: 32px;
  gap: 32px;
  align-content: start;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
}
.demo .stage { display: grid; }
.stage .ab { margin: 0; display: flex; flex-direction: column; gap: 6px; }
.stage figcaption { font-size: 11px; color: var(--text-dim); }
.stage svg { width: 100%; height: auto; aspect-ratio: var(--ar); box-shadow: 0 2px 12px rgb(0 0 0 / 0.2); }
.stage svg * { vector-effect: non-scaling-stroke; }
.stage .guide { stroke: #00b4ff; stroke-width: 1; }
.demo-note { grid-column: 1 / -1; font-size: 11px; color: var(--text-dim); }

@media (max-width: 720px) {
  .demo body { grid-template-columns: 1fr; grid-template-rows: 45vh 1fr; overflow: auto; }
  .demo .app { border-left: 0; border-top: 1px solid var(--line); }
}

/* Plugin Figma: le funzioni per la stampa su pagine affiancate non servono */
.figma .only-print { display: none; }

</style>
</head>
<body>

  <div class="app" id="app">
    <header class="bar">
      <div class="brand"><span data-icon="grid-four"></span>Reticolo</div>
      <button class="icon-btn" id="btnVisible" type="button" data-icon="eye" data-i18n-title="top.visible" aria-pressed="false"></button>
      <button class="icon-btn" id="btnLock" type="button" data-icon="lock-simple-open" data-i18n-title="top.lock" aria-pressed="false"></button>
      <button class="icon-btn" id="btnSettings" type="button" data-icon="gear-six" data-i18n-title="top.settings"></button>
      <button class="pill-btn" id="btnLibrary" type="button" data-i18n-title="top.library"><span data-icon="books"></span><span data-i18n="top.library"></span></button>
    </header>

    <!-- =============================================================== PRINCIPALE -->
    <main class="view" id="viewMain">
      <div class="notice" id="noDoc" hidden><span data-icon="warning-circle"></span><span data-i18n="noDoc"></span></div>

      <nav class="tabs" role="tablist">
        <button class="tab" type="button" role="tab" data-tab="columns" data-i18n="tab.columns"></button>
        <button class="tab" type="button" role="tab" data-tab="modular" data-i18n="tab.modular"></button>
        <button class="tab" type="button" role="tab" data-tab="baseline" data-i18n="tab.baseline"></button>
        <button class="tab" type="button" role="tab" data-tab="comp" data-i18n="tab.comp"></button>
      </nav>

      <div class="row target-row">
        <select class="select grow" id="target" aria-label="Target"></select>
        <button class="icon-btn" id="btnRefresh" type="button" data-icon="arrows-clockwise" data-i18n-title="target.refresh"></button>
      </div>

      <!-- Colonne -->
      <section data-pane="columns">
        <div class="grid2">
          <div class="field"><span class="lbl" data-i18n="f.columns"></span>
            <div class="num"><button class="step" type="button" data-step="-1" data-icon="minus" tabindex="-1"></button><input data-bind="columns.count" data-int data-min="1" data-max="64" inputmode="numeric"><button class="step" type="button" data-step="1" data-icon="plus" tabindex="-1"></button></div>
          </div>
          <label class="field"><span class="lbl" data-i18n="f.gutter"></span>
            <div class="num left"><input data-bind="columns.gutter" data-min="0" inputmode="decimal"><span class="suffix" data-unit></span></div>
          </label>
        </div>
        <label class="field"><span class="lbl"><span data-i18n="f.maxWidth"></span></span>
          <div class="num left"><input data-bind="columns.maxWidth" data-min="0" inputmode="decimal"><span class="suffix" data-unit></span></div>
          <span class="help" data-i18n="f.maxWidth.help"></span>
        </label>
        <label class="field"><span class="lbl" data-i18n="f.ratios"></span>
          <input class="input mono" data-bind="columns.ratios" data-text maxlength="80" placeholder="2 1 1   /   1 1 2 3 5" spellcheck="false">
          <span class="help" data-i18n="f.ratios.help"></span>
        </label>
        <label class="field"><span class="lbl" data-i18n="f.lead"></span>
          <div class="num left"><input data-bind="columns.lead" data-min="0" inputmode="decimal"><span class="suffix" data-unit></span></div>
          <span class="help" data-i18n="f.lead.help"></span>
        </label>
      </section>

      <!-- Modulare -->
      <section data-pane="modular">
        <div class="field"><span class="lbl" data-i18n="f.sizing"></span>
          <div class="seg" data-seg="modular.sizing">
            <button type="button" data-val="fit" data-i18n="f.sizing.fit"></button>
            <button type="button" data-val="fixed" data-i18n="f.sizing.fixed"></button>
          </div>
        </div>
        <div class="grid2" data-show="modular.sizing=fit">
          <div class="field"><span class="lbl" data-i18n="f.columns"></span>
            <div class="num"><button class="step" type="button" data-step="-1" data-icon="minus" tabindex="-1"></button><input data-bind="modular.cols" data-int data-min="1" data-max="64" inputmode="numeric"><button class="step" type="button" data-step="1" data-icon="plus" tabindex="-1"></button></div>
          </div>
          <div class="field"><span class="lbl" data-i18n="f.rows"></span>
            <div class="num"><button class="step" type="button" data-step="-1" data-icon="minus" tabindex="-1"></button><input data-bind="modular.rows" data-int data-min="1" data-max="64" inputmode="numeric"><button class="step" type="button" data-step="1" data-icon="plus" tabindex="-1"></button></div>
          </div>
        </div>
        <div class="grid2" data-show="modular.sizing=fixed">
          <label class="field"><span class="lbl" data-i18n="f.moduleW"></span>
            <div class="num left"><input data-bind="modular.mw" data-min="1" inputmode="decimal"><span class="suffix" data-unit></span></div>
          </label>
          <label class="field"><span class="lbl" data-i18n="f.moduleH"></span>
            <div class="num left"><input data-bind="modular.mh" data-min="1" inputmode="decimal"><span class="suffix" data-unit></span></div>
          </label>
        </div>
        <div class="grid2">
          <label class="field"><span class="lbl" data-i18n="f.gutterX"></span>
            <div class="num left"><input data-bind="modular.gx" data-min="0" inputmode="decimal"><span class="suffix" data-unit></span></div>
          </label>
          <label class="field"><span class="lbl" data-i18n="f.gutterY"></span>
            <div class="num left"><input data-bind="modular.gy" data-min="0" inputmode="decimal"><span class="suffix" data-unit></span></div>
          </label>
        </div>
        <label class="field" data-show="modular.sizing=fit" style="margin-top:10px"><span class="lbl" data-i18n="f.lead"></span>
          <div class="num left"><input data-bind="modular.lead" data-min="0" inputmode="decimal"><span class="suffix" data-unit></span></div>
          <span class="help" data-i18n="f.leadMod.help"></span>
        </label>
      </section>

      <!-- Baseline -->
      <section data-pane="baseline">
        <div class="field"><span class="lbl" data-i18n="f.direction"></span>
          <div class="seg" data-seg="baseline.dir">
            <button type="button" data-val="h" data-i18n="f.dir.h"></button>
            <button type="button" data-val="v" data-i18n="f.dir.v"></button>
            <button type="button" data-val="both" data-i18n="f.dir.both"></button>
            <button type="button" data-val="dots" data-i18n="f.dir.dots"></button>
          </div>
        </div>
        <div class="grid2">
          <label class="field"><span class="lbl" data-i18n="f.spacing"></span>
            <div class="num left"><input data-bind="baseline.spacing" data-min="0.5" inputmode="decimal"><span class="suffix" data-unit></span></div>
          </label>
          <div class="field"><span class="lbl" data-i18n="f.boldEvery"></span>
            <div class="num"><button class="step" type="button" data-step="-1" data-icon="minus" tabindex="-1"></button><input data-bind="baseline.boldEvery" data-int data-min="0" data-max="99" inputmode="numeric"><button class="step" type="button" data-step="1" data-icon="plus" tabindex="-1"></button></div>
          </div>
        </div>
        <label class="field"><span class="lbl" data-i18n="f.offset"></span>
          <div class="num left"><input data-bind="baseline.offset" data-min="0" inputmode="decimal"><span class="suffix" data-unit></span></div>
        </label>
      </section>

      <!-- Composizione -->
      <section data-pane="comp">
        <nav class="subtabs" role="tablist">
          <button class="subtab" type="button" role="tab" data-family="classic" data-i18n="sub.classic"></button>
          <button class="subtab" type="button" role="tab" data-family="symmetry" data-i18n="sub.symmetry"></button>
          <button class="subtab" type="button" role="tab" data-family="rabat" data-i18n="sub.rabat"></button>
          <button class="subtab" type="button" role="tab" data-family="geom" data-i18n="sub.geom"></button>
          <button class="subtab" type="button" role="tab" data-family="studio" data-i18n="sub.studio"></button>
          <button class="subtab" type="button" role="tab" data-family="social" data-i18n="sub.social"></button>
          <button class="subtab" type="button" role="tab" data-family="logo" data-i18n="sub.logo"></button>
          <button class="subtab" type="button" role="tab" data-family="layout" data-i18n="sub.layout"></button>
          <button class="subtab" type="button" role="tab" data-family="web" data-i18n="sub.web"></button>
        </nav>
        <div class="variants" id="variants"></div>
        <p class="help" data-show="comp.family=layout" data-i18n="layout.note" style="margin:-4px 0 10px"></p>
        <div data-show="comp.f:wgap">
          <p class="help" data-i18n="web.note" style="margin:-4px 0 10px"></p>
          <label class="field" data-show="comp.f:items"><span class="lbl" data-i18n="f.items"></span>
            <input class="input mono" data-bind="comp.items" data-text maxlength="400" placeholder="6x4 3x2 3x2 6x2 4x2/4/2 ..." spellcheck="false">
            <span class="help" data-i18n="f.items.help"></span>
          </label>
          <label class="field" data-show="comp.f:mitems"><span class="lbl" data-i18n="f.mitems"></span>
            <input class="input mono" data-bind="comp.mitems" data-text maxlength="400" placeholder="3 2 4 2 3 2 ..." spellcheck="false">
            <span class="help" data-i18n="f.mitems.help"></span>
          </label>
          <div class="grid2">
            <label class="field" data-show="comp.f:wgap"><span class="lbl" data-i18n="f.wgap"></span>
              <div class="num left"><input data-bind="comp.wgap" data-min="0" inputmode="decimal"><span class="suffix" data-unit></span></div>
            </label>
            <label class="field" data-show="comp.f:wrow"><span class="lbl" data-i18n="f.wrow"></span>
              <div class="num left"><input data-bind="comp.wrow" data-min="0" inputmode="decimal"><span class="suffix" data-unit></span></div>
            </label>
            <label class="field" data-show="comp.f:wmin"><span class="lbl" data-i18n="f.wmin"></span>
              <div class="num left"><input data-bind="comp.wmin" data-min="1" inputmode="decimal"><span class="suffix" data-unit></span></div>
            </label>
            <label class="field" data-show="comp.f:wrows"><span class="lbl" data-i18n="f.wrows"></span>
              <div class="num left"><input data-bind="comp.wrows" data-int data-min="1" data-max="40" inputmode="numeric"></div>
            </label>
            <label class="field" data-show="comp.f:mcols"><span class="lbl" data-i18n="f.mcols"></span>
              <div class="num left"><input data-bind="comp.mcols" data-int data-min="1" data-max="12" inputmode="numeric"></div>
            </label>
            <label class="field" data-show="comp.f:whead"><span class="lbl" data-i18n="f.whead"></span>
              <div class="num left"><input data-bind="comp.whead" data-min="0" data-max="60" inputmode="decimal"><span class="suffix">%</span></div>
            </label>
            <label class="field" data-show="comp.f:wfoot"><span class="lbl" data-i18n="f.wfoot"></span>
              <div class="num left"><input data-bind="comp.wfoot" data-min="0" data-max="60" inputmode="decimal"><span class="suffix">%</span></div>
            </label>
            <label class="field" data-show="comp.f:wside"><span class="lbl" data-i18n="f.wside"></span>
              <div class="num left"><input data-bind="comp.wside" data-min="0" data-max="45" inputmode="decimal"><span class="suffix">%</span></div>
            </label>
            <label class="field" data-show="comp.f:whero"><span class="lbl" data-i18n="f.whero"></span>
              <div class="num left"><input data-bind="comp.whero" data-min="5" data-max="90" inputmode="decimal"><span class="suffix">%</span></div>
            </label>
            <label class="field" data-show="comp.f:wcards"><span class="lbl" data-i18n="f.wcards"></span>
              <div class="num left"><input data-bind="comp.wcards" data-int data-min="1" data-max="24" inputmode="numeric"></div>
            </label>
            <label class="field" data-show="comp.f:wsplit"><span class="lbl" data-i18n="f.wsplit"></span>
              <div class="num left"><input data-bind="comp.wsplit" data-int data-min="1" data-max="11" inputmode="numeric"><span class="suffix">/ 12</span></div>
            </label>
            <label class="field" data-show="comp.f:wnav"><span class="lbl" data-i18n="f.wnav"></span>
              <div class="num left"><input data-bind="comp.wnav" data-min="3" data-max="40" inputmode="decimal"><span class="suffix">%</span></div>
            </label>
            <label class="field" data-show="comp.f:wtop"><span class="lbl" data-i18n="f.wtop"></span>
              <div class="num left"><input data-bind="comp.wtop" data-min="3" data-max="30" inputmode="decimal"><span class="suffix">%</span></div>
            </label>
            <label class="field" data-show="comp.f:wkpi"><span class="lbl" data-i18n="f.wkpi"></span>
              <div class="num left"><input data-bind="comp.wkpi" data-int data-min="1" data-max="8" inputmode="numeric"></div>
            </label>
          </div>
          <div data-show="comp.f:bp">
            <label class="field" style="margin-top:6px"><span class="lbl" data-i18n="f.bpPreset"></span>
              <select class="select" id="bpPreset">
                <option value="600,840">Material 3 (600 / 840)</option>
                <option value="768,1024">Tailwind (768 / 1024)</option>
                <option value="768,992">Bootstrap (768 / 992)</option>
                <option value="custom" data-i18n="f.bpCustom"></option>
              </select>
            </label>
            <div class="grid2">
              <label class="field" data-show="comp.f:bp"><span class="lbl" data-i18n="f.bpM"></span>
              <div class="num left"><input data-bind="comp.bpM" data-min="1" inputmode="decimal"><span class="suffix">px</span></div>
            </label>
            <label class="field" data-show="comp.f:bp"><span class="lbl" data-i18n="f.bpE"></span>
              <div class="num left"><input data-bind="comp.bpE" data-min="1" inputmode="decimal"><span class="suffix">px</span></div>
            </label>
            </div>
          </div>
          <div class="grid3" data-show="comp.f:cols">
            <label class="field" data-show="comp.f:cols"><span class="lbl" data-i18n="f.colsE"></span>
              <div class="num left"><input data-bind="comp.colsE" data-int data-min="1" data-max="24" inputmode="numeric"></div>
            </label>
            <label class="field" data-show="comp.f:cols"><span class="lbl" data-i18n="f.colsM"></span>
              <div class="num left"><input data-bind="comp.colsM" data-int data-min="1" data-max="24" inputmode="numeric"></div>
            </label>
            <label class="field" data-show="comp.f:cols"><span class="lbl" data-i18n="f.colsC"></span>
              <div class="num left"><input data-bind="comp.colsC" data-int data-min="1" data-max="24" inputmode="numeric"></div>
            </label>
          </div>
        </div>
        <p class="help" data-show="comp.family=social" data-i18n="social.note" style="margin:-4px 0 10px"></p>
        <div data-show="comp.logo">
          <div class="grid2">
            <label class="field"><span class="lbl" data-i18n="f.logoX"></span>
              <div class="num left"><input data-bind="comp.x" data-min="0" inputmode="decimal"><span class="suffix" data-unit></span></div>
            </label>
            <label class="field"><span class="lbl" data-i18n="f.logoClear"></span>
              <div class="num left"><input data-bind="comp.clear" data-min="1" inputmode="decimal"><span class="suffix">X</span></div>
            </label>
            <label class="field"><span class="lbl" data-i18n="f.logoSym"></span>
              <div class="num left"><input data-bind="comp.sym" data-min="0.5" inputmode="decimal"><span class="suffix">X</span></div>
            </label>
            <label class="field"><span class="lbl" data-i18n="f.logoGap"></span>
              <div class="num left"><input data-bind="comp.gap" data-min="0" inputmode="decimal"><span class="suffix">X</span></div>
            </label>
            <label class="field"><span class="lbl" data-i18n="f.logoWW"></span>
              <div class="num left"><input data-bind="comp.ww" data-min="1" inputmode="decimal"><span class="suffix">X</span></div>
            </label>
            <label class="field"><span class="lbl" data-i18n="f.logoWH"></span>
              <div class="num left"><input data-bind="comp.wh" data-min="0.5" inputmode="decimal"><span class="suffix">X</span></div>
            </label>
          </div>
          <p class="help" data-i18n="f.logoX.help" style="margin:6px 0 10px"></p>
        </div>
        <p class="help" data-show="comp.variant=typeLines" data-i18n="typeLines.note" style="margin:-4px 0 10px"></p>
        <div class="grid2">
          <label class="field" data-show="comp.spacing"><span class="lbl" data-i18n="f.geomSpacing"></span>
            <div class="num left"><input data-bind="comp.spacing" data-min="1" inputmode="decimal"><span class="suffix" data-unit></span></div>
          </label>
          <div class="field" data-show="comp.count"><span class="lbl" data-i18n="f.count"></span>
            <div class="num"><button class="step" type="button" data-step="-1" data-icon="minus" tabindex="-1"></button><input data-bind="comp.count" data-int data-min="2" data-max="180" inputmode="numeric"><button class="step" type="button" data-step="1" data-icon="plus" tabindex="-1"></button></div>
          </div>
          <div class="field"><span class="lbl">&nbsp;</span>
            <div class="flips">
              <button class="icon-btn" type="button" data-toggle="comp.flipH" data-icon="flip-horizontal" data-i18n-title="f.flipH" aria-pressed="false"></button>
              <button class="icon-btn" type="button" data-toggle="comp.flipV" data-icon="flip-vertical" data-i18n-title="f.flipV" aria-pressed="false"></button>
            </div>
          </div>
        </div>
      </section>

      <!-- Margini (comuni, legati al tipo attivo) -->
      <div class="field margins">
        <span class="lbl"><span data-i18n="f.margins"></span>
          <button class="icon-btn" type="button" id="btnLink" data-icon="link-simple" data-i18n-title="f.linkMargins" aria-pressed="false" style="width:22px;height:22px"></button>
        </span>
        <div class="cells">
          <label class="cell"><span data-i18n="f.top"></span><div class="num"><input data-bind="@.margins.t" data-min="0" data-margin inputmode="decimal"></div></label>
          <label class="cell"><span data-i18n="f.right"></span><div class="num"><input data-bind="@.margins.r" data-min="0" data-margin inputmode="decimal"></div></label>
          <label class="cell"><span data-i18n="f.bottom"></span><div class="num"><input data-bind="@.margins.b" data-min="0" data-margin inputmode="decimal"></div></label>
          <label class="cell"><span data-i18n="f.left"></span><div class="num"><input data-bind="@.margins.l" data-min="0" data-margin inputmode="decimal"></div></label>
        </div>
      </div>

      <div class="field"><span class="lbl" data-i18n="f.unit"></span>
        <div class="seg" data-seg="unit">
          <button type="button" data-val="px">px</button>
          <button type="button" data-val="mm">mm</button>
          <button type="button" data-val="pt">pt</button>
        </div>
      </div>

      <div class="readout" id="readout" aria-live="polite"></div>

      <div class="actions">
        <div class="row live-row">
          <span data-i18n="live"></span>
          <label class="switch"><input type="checkbox" id="live"><span class="track"></span><span class="sr-only" data-i18n="live"></span></label>
        </div>
        <div class="row live-row only-print" title="">
          <span data-i18n="set.mirror"></span>
          <label class="switch"><input type="checkbox" id="mirrorPages"><span class="track"></span><span class="sr-only" data-i18n="set.mirror"></span></label>
        </div>
        <p class="help only-print" data-i18n="set.mirror.help" style="margin:-2px 0 8px"></p>
        <div class="gen-row">
          <button class="btn primary" type="button" id="btnGenerate" data-i18n="generate"></button>
          <button class="btn" type="button" id="btnClear" data-i18n="clear"></button>
        </div>
        <div class="row preset-row">
          <span class="lbl" data-i18n="preset"></span>
          <select class="select grow" id="preset" aria-label="Preset"></select>
          <button class="icon-btn" type="button" id="btnSave" data-icon="floppy-disk" data-i18n-title="save.current"></button>
        </div>
        <form class="save-form" id="saveForm" hidden>
          <label class="field"><span class="lbl" data-i18n="save.name"></span><input class="input" id="saveName" maxlength="120" required></label>
          <label class="field"><span class="lbl" data-i18n="save.tags"></span><input class="input" id="saveTags" maxlength="200"></label>
          <div class="row">
            <button class="btn small" type="button" id="saveCancel" data-i18n="cancel"></button>
            <button class="btn small primary" type="submit" data-i18n="save.ok"></button>
          </div>
        </form>
      </div>
    </main>

    <!-- =============================================================== LIBRERIA -->
    <section class="view" id="viewLibrary" hidden style="position:relative">
      <div class="view-head">
        <button class="icon-btn" type="button" data-back data-icon="arrow-left" data-i18n-title="back"></button>
        <h2><span data-i18n="lib.title"></span><span class="count" id="libCount"></span></h2>
      </div>
      <div class="search"><span data-icon="magnifying-glass"></span><input class="input" id="libSearch" type="search" data-i18n-ph="lib.search" aria-label="Search"></div>
      <div class="chips" id="libChips"></div>
      <div class="lib-tools">
        <button class="btn primary small" type="button" id="libSave"><span data-icon="floppy-disk"></span><span data-i18n="save.current"></span></button>
        <button class="btn small" type="button" id="libImport"><span data-icon="download-simple"></span><span data-i18n="lib.import"></span></button>
        <button class="btn small" type="button" id="libExportAll"><span data-icon="export"></span><span data-i18n="lib.exportAll"></span></button>
      </div>
      <form class="save-form" id="libSaveForm" hidden>
        <label class="field"><span class="lbl" data-i18n="save.name"></span><input class="input" id="libSaveName" maxlength="120" required></label>
        <label class="field"><span class="lbl" data-i18n="save.tags"></span><input class="input" id="libSaveTags" maxlength="200"></label>
        <div class="row">
          <button class="btn small" type="button" id="libSaveCancel" data-i18n="cancel"></button>
          <button class="btn small primary" type="submit" data-i18n="save.ok"></button>
        </div>
      </form>
      <input type="file" id="fileInput" accept=".json,application/json" multiple hidden>
      <div class="lib-list" id="libList"></div>
      <div class="lib-foot">
        <span data-i18n="lib.file"></span>
        <code id="libPath"></code>
        <button class="btn small" type="button" id="libOpenFolder"><span data-icon="folder-open"></span><span data-i18n="lib.openFolder"></span></button>
      </div>
      <div class="dropzone" id="dropzone" hidden><span data-i18n="lib.drop"></span></div>
    </section>

    <!-- =============================================================== IMPOSTAZIONI -->
    <section class="view" id="viewSettings" hidden>
      <div class="view-head">
        <button class="icon-btn" type="button" data-back data-icon="arrow-left" data-i18n-title="back"></button>
        <h2 data-i18n="set.title"></h2>
      </div>

      <div class="section">
        <h3 data-i18n="set.language"></h3>

  function buildPayload() {

  function generate(silent) {

    if (b.error) { if (!silent) toast(t("err." + b.error), true); return; }
    if (!b.payload.targets.length) {

    H.call("draw", b.payload).then(function (res) {
      S.busy = false;

  /** Rinomina il livello griglia esistente invece di lasciarlo orfano. */

  function clearGrid() {

  // ---------------------------------------------------------------- miniature

  function refArtboard(grid) {
    if (grid.unit === "mm" || grid.unit === "pt") return { w: 595.28, h: 841.89 };
    return { w: 1440, h: 900 };
  }

  function thumbSVG(grid, ab, cls) {

    (out.prims || []).forEach(function (p) {
      if (p.t === "R") parts.push('<rect x="' + p.a[0] + '" y="' + p.a[1] + '" width="' + p.a[2] + '" height="' + p.a[3] + '" fill="currentColor" fill-opacity=".22" stroke="currentColor"/>');
      else if (p.t === "L") parts.push('<line x1="' + p.a[0] + '" y1="' + p.a[1] + '" x2="' + p.a[2] + '" y2="' + p.a[3] + '" stroke="currentColor"' + (p.b ? ' stroke-width="2"' : "") + "/>");
      else {

        parts.push("<" + (p.c ? "polygon" : "polyline") + ' points="' + pts.map(function (q) { return fmt(q[0]) + "," + fmt(q[1]); }).join(" ") + '" fill="none" stroke="currentColor"/>');

  // ---------------------------------------------------------------- rendering: principale

  function renderTargets() {
    var sel = $("#target"), app = S.doc ? S.doc.app : "ILST", opts = [];
    if (!S.doc) {
      sel.innerHTML = '<option value="all">' + esc(t("target.all")) + "</option>";
      return;
    }
    var abs = S.doc.artboards;
    if (app === "PHXS" && abs.length === 1 && abs[0].i === -1) {
      opts.push(["all", t("target.canvas")]);
    } else {
      opts.push(["all", app === "IDSN" ? t("target.allPages") : app === "FIGMA" ? t("target.allFrames") : t("target.all")]);
      opts.push(["active", app === "IDSN" ? t("target.activePage") : app === "FIGMA" ? t("target.activeFrame") : t("target.active")]);
      abs.forEach(function (a) { opts.push(["i:" + a.i, a.name]); });
    }

    var counters = {}, names = {};

      names[o.id] = t("obj." + o.kind) + " " + counters[o.kind];
    });
    var label = function (o) {
      var name = names[o.id] || o.name || t("obj." + o.kind);
      return name + " (" + Math.round(o.w) + " x " + Math.round(o.h) + " " + unit + (o.page ? ", " + t("obj.page") + " " + o.page : "") + ")";

    objOpts.push(["sel", t("target.selection") + (S.doc.selection ? ": " + label(S.doc.selection) : " (" + t("target.noSelection") + ")")]);

        return '<option value="b:' + p.id + '">' + esc(I.name(p.name)) + "</option>";
      }).join("") + "</optgroup>";
    });
    if (lib.grids.length) {
      html += '<optgroup label="' + esc(t("preset.mine")) + '">' + lib.grids.map(function (g) {
        return '<option value="u:' + esc(g.id) + '">' + esc(g.name) + "</option>";

  var variantsKey = "";

    var ab = resolveTargets()[0];

  }

  // ---------------------------------------------------------------- modifiche alla griglia

  function onGridChange(skipEl) {

    $("#preset").value = "";
    renderMain(skipEl);
    persist();
    liveGenerate();
  }

  function parseNum(inp) {
    var v = parseFloat(String(inp.value).replace(",", "."));
    if (!isFinite(v)) return null;
    if (inp.hasAttribute("data-int")) v = Math.round(v);
    var min = inp.dataset.min !== undefined ? parseFloat(inp.dataset.min) : -Infinity;
    var max = inp.dataset.max !== undefined ? parseFloat(inp.dataset.max) : Infinity;
    return Math.min(max, Math.max(min, v));
  }

  function commitInput(inp, fromTyping) {
    if (inp.hasAttribute("data-text")) {
      setPath(S.grid, resolvePath(inp.dataset.bind), inp.value);
      onGridChange(fromTyping ? inp : null);
      return;
    }
    var v = parseNum(inp), box = inp.closest(".num");
    if (v === null) { box.classList.add("invalid"); return; }
    box.classList.remove("invalid");
    var path = resolvePath(inp.dataset.bind);
    if (inp.hasAttribute("data-margin") && currentParams().margins.linked) {
      var m = currentParams().margins;
      m.t = m.r = m.b = m.l = v;
    } else setPath(S.grid, path, v);
    onGridChange(fromTyping ? inp : null);
  }

    inp.value = fmt(cur + dir * inc);

    renderMain();
    persist();
    liveGenerate();
  }

  // ---------------------------------------------------------------- viste

  function show(view) {

    $("#viewLibrary").hidden = view !== "library";

    if (view === "settings") renderSettings();
    if (view === "main") renderMain();
  }

  // ---------------------------------------------------------------- libreria

  var CHIPS = [["all", "lib.all"], ["fav", "lib.fav"], ["columns", "tab.columns"], ["modular", "tab.modular"], ["baseline", "tab.baseline"], ["comp", "tab.comp"], ["builtin", "lib.builtin"]];

  function libEntries() {
    var f = S.libFilter, q = S.libQuery.trim().toLowerCase();
    var list = f === "builtin" ? P.list.map(function (p) { return { id: p.id, name: I.name(p.name), grid: p.grid, tags: [t("cat." + p.cat)], builtin: true }; }) : lib.grids;
    return list.filter(function (e) {
      if (f === "fav" && !e.fav) return false;
      if (["columns", "modular", "baseline", "comp"].indexOf(f) >= 0 && e.grid.type !== f) return false;
      if (!q) return true;
      return (e.name + " " + (e.tags || []).join(" ") + " " + describe(e.grid)).toLowerCase().indexOf(q) >= 0;
    });
  }

  function cardHTML(e, i) {
    var g = E.normalize(e.grid), ab = refArtboard(g), id = esc(e.id);
    var name = S.renaming === e.id
      ? '<input class="input rename-input" data-rename="' + id + '" value="' + esc(e.name) + '" maxlength="120" aria-label="' + esc(t("lib.rename")) + '">'
      : '<div class="name" title="' + esc(e.name) + '">' + esc(e.name) + "</div>";
    var ops;
    if (S.confirming === e.id) {
      ops = '<div class="confirm"><span>' + esc(t("lib.deleteConfirm", { name: e.name })) + "</span>" +
        '<button class="btn small" type="button" data-op="cancelDelete" data-id="' + id + '">' + esc(t("cancel")) + "</button>" +
        '<button class="btn small danger" type="button" data-op="doDelete" data-id="' + id + '">' + esc(t("lib.delete")) + "</button></div>";
    } else if (e.builtin) {
      ops = '<div class="ops"><button class="btn small primary" type="button" data-op="apply" data-id="' + id + '">' + esc(t("lib.apply")) + "</button>" +
        '<button class="icon-btn" type="button" data-op="duplicate" data-id="' + id + '" title="' + esc(t("save.current")) + '">' + ico("copy") + "</button></div>";
    } else {
      ops = '<div class="ops"><button class="btn small primary" type="button" data-op="apply" data-id="' + id + '">' + esc(t("lib.apply")) + "</button>" +
        '<button class="icon-btn fav" type="button" data-op="fav" data-id="' + id + '" aria-pressed="' + !!e.fav + '" title="' + esc(t("lib.favToggle")) + '">' + ico(e.fav ? "star-fill" : "star") + "</button>" +
        '<button class="icon-btn" type="button" data-op="rename" data-id="' + id + '" title="' + esc(t("lib.rename")) + '">' + ico("pencil-simple") + "</button>" +
        '<button class="icon-btn" type="button" data-op="duplicate" data-id="' + id + '" title="' + esc(t("lib.duplicate")) + '">' + ico("copy") + "</button>" +
        '<button class="icon-btn" type="button" data-op="export" data-id="' + id + '" title="' + esc(t("lib.export")) + '">' + ico("export") + "</button>" +
        '<button class="icon-btn" type="button" data-op="delete" data-id="' + id + '" title="' + esc(t("lib.delete")) + '">' + ico("trash") + "</button></div>";
    }
    var tags = (e.tags || []).length ? '<div class="tags">' + e.tags.map(function (x) { return '<span class="tag">' + esc(x) + "</span>"; }).join("") + "</div>" : "";
    return '<article class="card" style="--i:' + Math.min(i, 12) + '">' + thumbSVG(g, ab, "thumb") +
      '<div class="body">' + name + '<div class="meta">' + esc(describe(g)) + "</div>" + tags + ops + "</div></article>";
  }

  function renderLibrary() {
    $("#libChips").innerHTML = CHIPS.map(function (c) {
      return '<button class="chip" type="button" data-chip="' + c[0] + '" aria-pressed="' + (S.libFilter === c[0]) + '">' + esc(t(c[1])) + "</button>";
    }).join("");
    $("#libCount").textContent = String(lib.grids.length);
    var list = libEntries(), el = $("#libList");
    if (!list.length) {
      var empty = !S.libQuery && (S.libFilter === "all" || S.libFilter === "fav");
      el.innerHTML = '<div class="empty">' + ico(empty ? "books" : "magnifying-glass") +
        "<strong>" + esc(empty ? t("lib.empty.title") : t("lib.noResults")) + "</strong>" +
        (empty ? "<p>" + esc(t("lib.empty.body")) + '</p><button class="btn small" type="button" data-chip="builtin">' + esc(t("lib.builtin")) + "</button>" : "") + "</div>";
    } else {
      el.innerHTML = list.map(cardHTML).join("");
    }
    $("#libPath").textContent = H.isCEP ? LIBRARY_PATH : H.isFigma ? t("lib.figmaPath") : "localStorage (anteprima)";
    var r = $("[data-rename]");
    if (r) { r.focus(); r.select(); }
  }

  function findEntry(id) {
    if (id.indexOf("builtin:") === 0) {
      var p = P.list.filter(function (x) { return x.id === id; })[0];
      return p ? { id: p.id, name: I.name(p.name), grid: p.grid, tags: [p.cat], builtin: true } : null;
    }
    return lib.get(id);
  }

  function libOp(op, id) {
    var e = findEntry(id);
    if (!e) return;
    if (op === "apply") {
      applyGrid(e.grid);
      S.presetValue = (e.builtin ? "b:" : "u:") + e.id;
      show("main");
      renderPresets();
      toast(t("lib.applied", { name: e.name }));
      return;
    }
    if (op === "fav") lib.update(id, { fav: !e.fav });
    else if (op === "rename") S.renaming = id;
    else if (op === "duplicate") {
      if (e.builtin) { lib.add(e.name, E.normalize(e.grid), e.tags); toast(t("lib.saved")); }
      else lib.duplicate(id, t("lib.copy"));
    } else if (op === "export") exportGrids([id], e.name);
    else if (op === "delete") S.confirming = id;
    else if (op === "cancelDelete") S.confirming = null;
    else if (op === "doDelete") { lib.remove(id); S.confirming = null; }
    renderLibrary();
    renderPresets();
  }

  function slug(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "griglie"; }

  function exportGrids(ids, name) {
    var text = lib.exportText(ids), file = "reticolo-" + slug(name || "libreria") + ".json";
    if (!H.isCEP) { H.download(file, text); return; }
    var path = H.fs.saveDialog(t("lib.export"), file);
    if (!path) return;
    if (H.fs.write(path, text)) toast(t("lib.exported", { path: path }));
    else toast(t("hostError", { msg: path }), true);
  }

  function importTexts(texts) {
    var total = 0;
    texts.forEach(function (txt) { total += lib.importText(txt).count; });
    if (total) toast(t("lib.imported", { n: total }));
    else toast(t("lib.importNone"), true);
    S.libFilter = "all";
    renderLibrary();
    renderPresets();
  }

  function importFiles(files) {
    var list = Array.prototype.slice.call(files || []).filter(function (f) { return /\.json$/i.test(f.name) || f.type === "application/json"; });
    if (!list.length) { toast(t("lib.importNone"), true); return; }
    Promise.all(list.map(function (f) {
      return new Promise(function (res) { var r = new FileReader(); r.onload = function () { res(String(r.result)); }; r.onerror = function () { res(""); }; r.readAsText(f); });
    })).then(importTexts);
  }

  function openSaveForm(form, nameInput) {
    form.hidden = false;
    var preset = $("#preset");
    var label = preset.value ? preset.options[preset.selectedIndex].text : describe(S.grid);
    nameInput.value = label;
    nameInput.focus();
    nameInput.select();
  }

  function saveCurrent(nameInput, tagsInput, form) {
    var name = nameInput.value.trim();
    if (!name) { nameInput.focus(); return; }
    var tags = tagsInput.value.split(",").map(function (s) { return s.trim(); }).filter(Boolean);
    var e = lib.add(name, S.grid, tags);
    form.hidden = true;
    tagsInput.value = "";
    S.presetValue = "u:" + e.id;
    renderPresets();
    if (S.view === "library") { S.libFilter = "all"; renderLibrary(); }
    toast(t("lib.saved"));
  }

  // ---------------------------------------------------------------- impostazioni

  function renderSettings() {
    $("#mirrorPages").checked = !!S.set.mirrorPages;
    $$("[data-setting]").forEach(function (el) {
      var v = getPath(S.set, el.dataset.setting);
      if (el.type === "checkbox") el.checked = !!v;
      else el.value = el.type === "color" ? String(v).toLowerCase() : v;
    });
    $$("[data-setting-hex]").forEach(function (el) { el.value = getPath(S.set, el.dataset.settingHex); });
    $$("[data-setting-seg]").forEach(function (seg) {
      var v = getPath(S.set, seg.dataset.settingSeg);
      $$("button", seg).forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.val === v)); });
    });
    $("#guidesHelp").hidden = S.set.render !== "guides";
  }

  function settingChanged(redrawSettings) {
    persist();
    if (redrawSettings) renderSettings();
    liveGenerate();
  }

  function setLang(lang) {
    I.lang = lang;
    S.set.lang = lang;
    I.apply();
    renderTargets();
    renderPresets();
    renderMain();
    if (S.view === "library") renderLibrary();
    renderSettings();
    persist();
  }

  // ---------------------------------------------------------------- toast

  var toastTimer;
  function toast(msg, isErr) {
    var el = $("#toast");
    el.textContent = msg;
    el.classList.toggle("err", !!isErr);
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, isErr ? 4500 : 2200);
  }

  // ---------------------------------------------------------------- eventi

  function bind() {
    // barra
    $("#btnLibrary").addEventListener("click", function () { show(S.view === "library" ? "main" : "library"); });
    $("#btnSettings").addEventListener("click", function () { show(S.view === "settings" ? "main" : "settings"); });
    $$("[data-back]").forEach(function (b) { b.addEventListener("click", function () { show("main"); }); });
    $("#btnVisible").addEventListener("click", function () {
      H.call("setLayer", { layer: layerName(), visible: !S.layer.visible }).then(function (r) {
        if (r && !r.error) { S.layer.visible = r.visible; S.layer.locked = r.locked; renderLayerButtons(); }
      });
    });
    $("#btnLock").addEventListener("click", function () {
      H.call("setLayer", { layer: layerName(), locked: !S.layer.locked }).then(function (r) {
        if (r && !r.error) { S.layer.visible = r.visible; S.layer.locked = r.locked; renderLayerButtons(); }
      });
    });

    // tab e target
    $$(".tab").forEach(function (b) {
      b.addEventListener("click", function () { S.grid.type = b.dataset.tab; onGridChange(); });
    });
    $$(".subtab").forEach(function (b) {
      b.addEventListener("click", function () {
        var fam = b.dataset.family, c = S.grid.comp;
        if (c.family === fam) return;
        c.family = fam;
        c.variant = E.VARIANTS[fam][0];
        onGridChange();
      });
    });
    $("#variants").addEventListener("click", function (e) {
      var b = e.target.closest("[data-variant]");
      if (!b) return;
      S.grid.comp.variant = b.dataset.variant;
      onGridChange();
    });
    $("#target").addEventListener("change", function (e) { S.set.target = e.target.value; persist(); readout(); liveGenerate(); });
    $("#btnRefresh").addEventListener("click", function () { refreshDoc(); });

    // campi numerici
    var main = $("#viewMain");
    main.addEventListener("input", function (e) { if (e.target.dataset.bind) commitInput(e.target, true); });
    main.addEventListener("change", function (e) { if (e.target.dataset.bind) renderMain(); });
    main.addEventListener("keydown", function (e) {
      if (!e.target.dataset.bind) return;
      if ((e.key === "ArrowUp" || e.key === "ArrowDown") && !e.target.hasAttribute("data-text")) { e.preventDefault(); stepInput(e.target, e.key === "ArrowUp" ? 1 : -1, e); }
      if (e.key === "Enter") { e.target.blur(); generateNow(); }
    });
    main.addEventListener("click", function (e) {
      var st = e.target.closest(".step");
      if (st) { e.preventDefault(); stepInput($("input", st.parentNode), parseInt(st.dataset.step, 10), e); return; }
      var sb = e.target.closest("[data-seg] button");
      if (sb) { setPath(S.grid, sb.parentNode.dataset.seg, sb.dataset.val); onGridChange(); return; }
      var tg = e.target.closest("[data-toggle]");
      if (tg) { var path = tg.dataset.toggle; setPath(S.grid, path, !getPath(S.grid, path)); onGridChange(); }
    });
    $("#btnLink").addEventListener("click", function (e) {
      e.preventDefault();
      var m = currentParams().margins;
      m.linked = !m.linked;
      if (m.linked) m.r = m.b = m.l = m.t;
      onGridChange();
    });

    // azioni
    $("#bpPreset").addEventListener("change", function (e) {
      if (e.target.value === "custom") return;
      var v = e.target.value.split(",");
      S.grid.comp.bpM = parseInt(v[0], 10); S.grid.comp.bpE = parseInt(v[1], 10);
      onGridChange(null);
    });
    $("#mirrorPages").addEventListener("change", function (e) { S.set.mirrorPages = e.target.checked; persist(); liveGenerate(); });
    $("#live").addEventListener("change", function (e) { S.set.live = e.target.checked; persist(); if (S.set.live) generate(true); });
    $("#btnGenerate").addEventListener("click", generateNow);
    $("#btnClear").addEventListener("click", clearGrid);
    $("#preset").addEventListener("change", function (e) {
      var v = e.target.value;
      if (!v) return;
      var entry = findEntry(v.slice(2));
      if (!entry) return;
      S.presetValue = v;
      applyGrid(entry.grid);
      e.target.value = v;
    });
    $("#btnSave").addEventListener("click", function () {
      var f = $("#saveForm");
      if (!f.hidden) { f.hidden = true; return; }
      openSaveForm(f, $("#saveName"));
    });
    $("#saveCancel").addEventListener("click", function () { $("#saveForm").hidden = true; });
    $("#saveForm").addEventListener("submit", function (e) { e.preventDefault(); saveCurrent($("#saveName"), $("#saveTags"), $("#saveForm")); });

    // libreria
    var lv = $("#viewLibrary");
    $("#libSearch").addEventListener("input", function (e) { S.libQuery = e.target.value; renderLibrary(); });
    lv.addEventListener("click", function (e) {
      var chip = e.target.closest("[data-chip]");
      if (chip) { S.libFilter = chip.dataset.chip; S.confirming = S.renaming = null; renderLibrary(); return; }
      var op = e.target.closest("[data-op]");
      if (op) libOp(op.dataset.op, op.dataset.id);
    });
    function commitRename(id, value) {
      if (S.renaming !== id) return;
      var v = String(value).trim();
      if (v) lib.update(id, { name: v });
      S.renaming = null;
      setTimeout(function () { renderLibrary(); renderPresets(); }, 0);
    }
    lv.addEventListener("keydown", function (e) {
      var r = e.target.dataset && e.target.dataset.rename;
      if (!r) return;
      if (e.key === "Enter") commitRename(r, e.target.value);
      if (e.key === "Escape") { S.renaming = null; renderLibrary(); }
    });
    lv.addEventListener("focusout", function (e) {
      var r = e.target.dataset && e.target.dataset.rename;
      if (r) commitRename(r, e.target.value);
    });
    $("#libSave").addEventListener("click", function () { openSaveForm($("#libSaveForm"), $("#libSaveName")); });
    $("#libSaveCancel").addEventListener("click", function () { $("#libSaveForm").hidden = true; });
    $("#libSaveForm").addEventListener("submit", function (e) { e.preventDefault(); saveCurrent($("#libSaveName"), $("#libSaveTags"), $("#libSaveForm")); });
    $("#libImport").addEventListener("click", function () {
      if (!H.isCEP) { $("#fileInput").click(); return; }
      var paths = H.fs.openDialog(t("lib.import"));
      if (paths && paths.length) importTexts(paths.map(function (p) { return H.fs.read(p) || ""; }));
    });
    $("#fileInput").addEventListener("change", function (e) { importFiles(e.target.files); e.target.value = ""; });
    $("#libExportAll").addEventListener("click", function () { exportGrids(null, "libreria"); });
    $("#libOpenFolder").addEventListener("click", function () { H.fs.openFolder(BASE); });
    var dragDepth = 0;
    lv.addEventListener("dragenter", function (e) { e.preventDefault(); dragDepth++; $("#dropzone").hidden = false; });
    lv.addEventListener("dragover", function (e) { e.preventDefault(); });
    lv.addEventListener("dragleave", function () { if (--dragDepth <= 0) { dragDepth = 0; $("#dropzone").hidden = true; } });
    lv.addEventListener("drop", function (e) { e.preventDefault(); dragDepth = 0; $("#dropzone").hidden = true; importFiles(e.dataTransfer.files); });

    // impostazioni
    var sv = $("#viewSettings");
    sv.addEventListener("input", function (e) {
      var el = e.target;
      if (el.dataset.setting) {
        var path = el.dataset.setting, v;
        if (el.type === "checkbox") v = el.checked;
        else if (el.hasAttribute("data-num")) { v = parseNum(el); if (v === null) return; }
        else v = el.value;
        if (el.type === "color") v = v.toUpperCase();
        setPath(S.set, path, v);
        if (el.type === "color") $('[data-setting-hex="' + path + '"]').value = v;
        if (path === "render") $("#guidesHelp").hidden = v !== "guides";
        if (path === "layer") return; // si applica alla conferma (change), non a ogni tasto
        settingChanged(false);
      } else if (el.dataset.settingHex) {
        var hex = el.value.trim();
        if (!/^#?[0-9a-f]{6}$/i.test(hex)) return;
        hex = ("#" + hex.replace("#", "")).toUpperCase();
        setPath(S.set, el.dataset.settingHex, hex);
        $('[data-setting="' + el.dataset.settingHex + '"]').value = hex.toLowerCase();
        settingChanged(false);
      }
    });
    sv.addEventListener("change", function (e) {
      if (e.target.dataset.setting === "layer") { renameLayer(e.target.value); return; }
      if (e.target.dataset.setting) renderSettings();
    });
    sv.addEventListener("click", function (e) {
      var b = e.target.closest("[data-setting-seg] button");
      if (b && b.parentNode.dataset.settingSeg === "lang") setLang(b.dataset.val);
    });
    var resetArmed = null;
    $("#btnReset").addEventListener("click", function (e) {
      var btn = e.currentTarget;
      if (!resetArmed) {
        btn.textContent = t("set.resetConfirm");
        resetArmed = setTimeout(function () { resetArmed = null; btn.textContent = t("set.reset"); }, 4000);
        return;
      }
      clearTimeout(resetArmed);
      resetArmed = null;
      var lang = S.set.lang;
      S.set = defaultSettings();
      S.set.lang = lang;
      S.grid = S.set.grid;
      btn.textContent = t("set.reset");
      persist();
      renderSettings();
      renderTargets();
      toast(t("set.reset"));
    });

    // host
    H.on("documentAfterActivate", function () { refreshDoc(); });
    H.on("documentAfterDeactivate", function () { setTimeout(refreshDoc, 150); });
    H.on("com.adobe.csxs.events.ThemeColorChanged", applyTheme);
    window.addEventListener("rtc-mock-change", function () { refreshDoc(); });
    window.addEventListener("focus", function () {
      if (!H.hosted) return;
      refreshDoc();
      lib.sync();
      renderPresets();
      if (S.view === "library" && !S.renaming) renderLibrary();
    });
  }

  // ---------------------------------------------------------------- avvio

  function init() {
    applyTheme();
    $$("[data-icon]").forEach(function (el) {
      var html = ico(el.dataset.icon);
      if (el.children.length || el.textContent.trim()) el.insertAdjacentHTML("afterbegin", html);
      else el.innerHTML = html;
    });
    if (H.isFigma) {
      $('option[value="guides"]').dataset.i18n = "set.figmaGrid";
      $("#guidesHelp").dataset.i18n = "set.figmaHelp";
    }
    I.apply();
    bind();
    renderPresets();
    renderTargets();
    renderMain();
    renderLayerButtons();
    if (!H.hosted) document.title = "Reticolo - " + t("demo");
    if (lib.recovered) toast(t("lib.recovered"), true);
    refreshDoc();
  }

  init();
})();

}
parent.postMessage({ pluginMessage: { type: "ready" } }, "*");
</script>
</body>
</html>
